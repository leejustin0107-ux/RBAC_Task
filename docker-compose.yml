services:
  db:
    image: postgres:16
    container_name: rbac-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rbac_app

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rbac_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server

    container_name: rbac-server

    restart: unless-stopped

    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/rbac_app
      JWT_SECRET: docker-development-secret
      JWT_EXPIRES_IN: 1h
      CLIENT_URL: http://localhost:5173

    ports:
      - "5000:5000"

    depends_on:
      db:
        condition: service_healthy

    command: sh -c "npm run seed && npm run dev"

  client:
    build:
      context: ./client

    container_name: rbac-client

    restart: unless-stopped

    environment:
      VITE_API_URL: http://localhost:5000/api

    ports:
      - "5173:5173"

    depends_on:
      - server

volumes:
  postgres_data: